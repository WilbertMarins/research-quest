[project]
name = "research-quest"
version = "0.1.0"
description = "MVP de pesquisa com RAG e respostas fundamentadas em fontes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1,<2.0.0",
    "fastapi[standard]>=0.162.0,<0.163.0",
    "groq>=1.7.0,<1.8.0",
    "langgraph>=1.2.18,<1.3.0",
    "pgvector>=0.5.1,<0.6.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sentence-transformers>=6.2.0,<6.3.0",
    "sqlalchemy>=2.1.6,<2.2.0",
    "torch>=2.14.1,<2.15.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.8,<0.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]
markers = [
    "integration: requires external infrastructure such as PostgreSQL",
    "evaluation: loads the configured embedding model for quality checks",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["apps/api/src", "migrations", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
