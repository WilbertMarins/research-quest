[project]
name = "research-quest"
version = "0.1.0"
description = "MVP de pesquisa com RAG e respostas fundamentadas em fontes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.162.0,<0.163.0",
    "pydantic-settings>=2.16.1,<3.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "pytest>=9.1.1,<10.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]
