[project]
name = "research-quest"
version = "0.1.0"
description = "MVP de pesquisa com RAG e respostas fundamentadas em fontes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1,<2.0.0",
    "fastapi[standard]>=0.162.0,<0.163.0",
    "pydantic-settings>=2.16.1,<3.0.0",
    "psycopg[binary]>=3.3.6,<4.0.0",
    "sqlalchemy>=2.1.6,<2.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29.0",
    "pytest>=9.1.1,<10.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]
markers = [
    "integration: requires external infrastructure such as PostgreSQL",
]
